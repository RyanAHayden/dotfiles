# GuliKit firmware freezes/disconnects on any BT rumble report, so skip the
# connect buzz. Game rumble is blocked by udev/rules.d/99-gulikit-no-ff.rules.
options hid_xpadneo ff_connect_notify=0
# hid_microsoft grabs each pad before xpadneo's udev rebind, and hid-input's
# battery setup fires 7 GET_REPORTs (input report 4) the pad rejects mid-connect.
# xpadneo ignores that field, so let it bind directly.
blacklist hid_microsoft
