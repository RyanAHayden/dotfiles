# Laptop keys, toggled by ~/bin/laptop-keys (SUPER+CTRL+ALT+K); installed to /etc/keyd/default.conf by setup.sh.
# Caps is Ctrl, Fn + hjkl are arrows. Fn works on Apple keyboards (the MacBook's included): hid_apple reports it as its
# own key after doing its F-row translation, so Fn + F-keys still do brightness/volume.
[ids]
*

[main]
capslock = leftcontrol
fn = layer(arrows)

[arrows]
h = left
j = down
k = up
l = right
