listener {
    timeout = 300
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({action="off"})'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({action="on"})'
}

# Laptop on battery: suspend after 15 minutes at the login screen (no-op on the desktop and on AC)
listener {
    timeout = 900
    on-timeout = /etc/sddm/idle-suspend
}
