# FileChooser=kde: xdg-desktop-portal blocks starting this backend, while the backend's
# Qt startup calls back into xdg-desktop-portal (host registration + gtk3 theme reading
# portal Settings) -> 25s D-Bus deadlock that stalls the shell/bar at login.
[Service]
Environment=QT_NO_XDG_DESKTOP_PORTAL=1 QT_QPA_PLATFORMTHEME=kde
